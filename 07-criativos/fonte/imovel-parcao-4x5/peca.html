<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Bridge Moinhos 4:5</title>
<style>
@font-face{font-family:Satoshi;src:url(../../../public/assets/Satoshi-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:Satoshi;src:url(../../../public/assets/Satoshi-Bold.woff2) format('woff2');font-weight:700}
:root{--bg:#f1ede2;--navy:#1e1b2e;--bronze:#94694a;--frame:#c9b4a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--bg);overflow:hidden}
body{font-family:Satoshi,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:26px;border:1.5px solid var(--frame)}
.page{position:absolute;inset:26px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 8px 34px}
.logo{width:286px;display:block}
h1{font-weight:700;font-size:45px;line-height:1.17;letter-spacing:-.2px;margin-top:30px}
.sub{font-size:31px;margin-top:10px}
.grid{flex:1;align-self:stretch;margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:7px;min-height:0}
.grid img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.addr{font-size:33px;margin-top:28px}
.specs{font-size:40px;margin-top:4px;word-spacing:4px}
.specs span+span{margin-left:22px}
.feat{font-size:26px;margin-top:6px}
.feat span+span{margin-left:14px}
.price{font-weight:700;font-size:40px;color:var(--bronze);margin-top:24px}
.cta{font-weight:700;font-size:35px;color:var(--bronze);margin-top:20px}
.contact{font-size:35px;line-height:1.22;margin-top:2px}
</style></head>
<body>
<div class="frame"></div>
<div class="page">
  <img class="logo" src="logo-bridge.png" alt="Bridge">
  <h1>Oportunidade Imperdível no Moinhos<br>de Vento em frente ao Parcão</h1>
  <p class="sub">Prédio Assinado por Emil Bered</p>
  <div class="grid">
    <img src="1-fachada.jpg" style="object-position:40% 50%">
    <img src="2-lareira.jpg" style="object-position:40% 50%">
    <img src="3-vista.jpg" style="object-position:50% 50%">
    <img src="4-janelas.jpg" style="object-position:30% 50%">
    <img src="5-sala.jpg" style="object-position:50% 60%">
    <img src="6-sacada.jpg" style="object-position:50% 50%">
  </div>
  <p class="addr">Rua Comendador Caminha</p>
  <p class="specs"><span>3 Dormitórios</span><span>1 Suíte</span><span>2 Vagas</span><span>225 m²</span></p>
  <p class="feat"><span>2 sacadas</span><span>lareira</span><span>1 por andar</span><span>4 frentes de insolação (N, S, L, O)</span></p>
  <p class="price">Investimento R$ 1.915.000,00</p>
  <p class="cta">Agende sua visita!</p>
  <p class="contact">(51) 3014 9601<br>@bridgeimoveis</p>
</div>
</body></html>

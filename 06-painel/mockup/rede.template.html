<title>Painel de Corretores</title>
<style>
@font-face{font-family:'Satoshi';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,__SATOSHI_R__) format('woff2')}
@font-face{font-family:'Satoshi';font-weight:700;font-display:swap;src:url(data:font/woff2;base64,__SATOSHI_B__) format('woff2')}

/* Identidade Case: superfícies chapadas, navy para display, branco para conteúdo.
   Painel de marca — tema único e deliberado, tudo pintado explicitamente. */
:root{
  --navy:#1A2447; --orange:#EA7439; --orange-dark:#BC4C14;
  --bege:#F9DEC0; --blue-2:#4660AA;
  --off:#FAF5F5; --branco:#FFFFFF;
  --ink:#1A2447; --ink-2:#3E4763; --ink-3:#77809B;
  --linha:rgba(26,36,71,.14); --linha-forte:rgba(26,36,71,.28);
  /* Semáforo, separado do laranja da marca. Amarelo puro não passa em contraste
     sobre branco: o texto usa o tom escuro, as faixas usam o vivo. */
  --pos:#21874D; --neg:#EF0000; --atn:#8A6D00; --atn-vivo:#EAB308;
  --pos-nv:#6BDB9B; --neg-nv:#FF8585; --atn-nv:#FFD166;
  --sombra:0 1px 2px rgba(26,36,71,.06), 0 10px 28px rgba(26,36,71,.07);
  --sans:'Satoshi', Manrope, Inter, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{background:var(--off)}
body{margin:0;font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.55;
  color:var(--ink-2);background:var(--off);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px 72px}

.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;
  color:var(--bege);margin:0}
h1{margin:10px 0 0;font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.028em;
  line-height:1.05;color:#fff;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
h2{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;
  color:var(--ink)}
.lede{margin:13px 0 0;font-size:15.5px;color:rgba(255,255,255,.80);max-width:54ch}
.lede b{color:var(--bege);font-weight:700}

.hero{margin:0 -22px 30px;padding:36px 22px 32px;background:var(--navy)}
.hero-in{max-width:1236px;margin:0 auto;display:flex;flex-wrap:wrap;gap:26px;
  align-items:flex-end;justify-content:space-between}
.hero-meta{display:flex;flex-direction:column;align-items:flex-end;gap:14px;flex:0 0 auto}
.logo{height:44px;width:auto;display:block;flex:none}
.stamp{font-size:11.5px;color:rgba(255,255,255,.72);text-align:right;line-height:1.8;
  font-variant-numeric:tabular-nums}
.stamp b{color:var(--bege);font-weight:700}

.note{display:flex;gap:12px;padding:14px 17px;border-radius:12px;font-size:13.5px;line-height:1.6;
  background:var(--branco);border:1px solid var(--linha);color:var(--ink-2);box-shadow:var(--sombra);
  margin-bottom:16px}
.note .ico{flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;margin-top:1px;background:rgba(234,116,57,.14);color:var(--orange-dark)}
.note .ico svg{width:13px;height:13px}
.note b{color:var(--ink);font-weight:700}

section{display:flex;flex-direction:column;gap:15px;margin-top:38px}
.sec-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between}
.sec-head p{margin:6px 0 0;font-size:13.5px;color:var(--ink-3);max-width:64ch}

/* ---------- barra de período ---------- */
.periodbar{display:flex;flex-direction:column;gap:12px;background:var(--branco);
  border:1px solid var(--linha);border-radius:14px;padding:14px;box-shadow:var(--sombra)}
.pb-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pb-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--off);
  border:1px solid var(--linha);border-radius:11px}
.seg button{appearance:none;border:0;background:none;font-family:var(--sans);font-size:13px;
  font-weight:700;color:var(--ink-2);padding:8px 15px;border-radius:8px;cursor:pointer;
  transition:background .14s,color .14s;white-space:nowrap}
.seg button:hover{color:var(--ink);background:rgba(26,36,71,.05)}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--navy)}
.seg button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.seg-lbl{font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-3);padding-left:4px}
.periodo-nota{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.periodo-nota b{color:var(--ink);font-weight:700}

/* ---------- placar ---------- */
.placar{background:var(--navy);border-radius:16px;padding:24px 26px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:22px 30px}
.pl{display:flex;flex-direction:column;gap:3px}
.pl .rot{font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--bege)}
.pl .n{font-size:clamp(28px,3.4vw,40px);font-weight:700;letter-spacing:-.04em;line-height:1.02;
  font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
.pl .n.destaque{color:var(--bege)}
.pl .sub{font-size:12px;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;margin-top:2px}
.pl .sub b{color:#fff;font-weight:700}
.semaforo{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.sf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  padding:4px 11px;border-radius:20px;border:1px solid;font-variant-numeric:tabular-nums}
.sf .dot{width:7px;height:7px;border-radius:50%}
.sf.ok{color:var(--pos-nv);border-color:rgba(107,219,155,.4);background:rgba(107,219,155,.12)}
.sf.ok .dot{background:var(--pos-nv)}
.sf.warn{color:var(--atn-nv);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.12)}
.sf.warn .dot{background:var(--atn-nv)}
.sf.bad{color:var(--neg-nv);border-color:rgba(255,133,133,.4);background:rgba(255,133,133,.12)}
.sf.bad .dot{background:var(--neg-nv)}

.var{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.var.bom{color:var(--pos)} .var.ruim{color:var(--neg)} .var.neutro{color:var(--ink-3)}
.placar .var.bom{color:var(--pos-nv)} .placar .var.ruim{color:var(--neg-nv)}
.placar .var.neutro{color:rgba(255,255,255,.6)}

/* ---------- cartões de corretor ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(268px,100%),1fr));gap:14px}
.u{background:var(--branco);border:1px solid var(--linha);border-radius:14px;
  padding:15px 16px 14px;box-shadow:var(--sombra);display:flex;flex-direction:column;
  transition:border-color .15s}
.u:hover{border-color:var(--linha-forte)}
.u.bad{border-left:3px solid var(--neg)}
.u.warn{border-left:3px solid var(--atn-vivo)}
.u.ok{border-left:3px solid var(--pos)}
.u-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.u-quem{display:flex;gap:12px;align-items:center;min-width:0}
/* O rosto é o ponto do cartão: o projeto do Carlos é sobre corretor, não sobre campanha.
   96px é o teto que a menor foto original (227px) sustenta em tela retina. */
.retrato{width:56px;height:56px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  border:2px solid var(--branco);box-shadow:0 0 0 1px var(--linha-forte);background:var(--off)}
.u-nome{font-size:17px;font-weight:700;letter-spacing:-.018em;color:var(--ink);line-height:1.2;
  overflow-wrap:anywhere}
.u-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;min-height:18px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:var(--off);color:var(--ink-3);
  border:1px solid var(--linha);white-space:nowrap}
.chip.novo{color:var(--blue-2);background:rgba(70,96,170,.08);border-color:rgba(70,96,170,.22)}
.pos{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--off);
  border:1px solid var(--linha);border-radius:7px;width:25px;height:25px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.u-cpr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:13px}
.u-cpr .n{font-size:28px;font-weight:700;letter-spacing:-.042em;line-height:1;
  font-variant-numeric:tabular-nums}
.u.ok .u-cpr .n{color:var(--pos)} .u.warn .u-cpr .n{color:var(--atn)}
.u.bad .u-cpr .n{color:var(--neg)}
.u-cpr .l{font-size:10.5px;color:var(--ink-3);width:100%;margin-top:2px}

.regua{margin-top:12px}
.regua-track{position:relative;height:8px;border-radius:5px;overflow:hidden;display:flex;
  border:1px solid var(--linha)}
.regua-track i{display:block;height:100%}
.regua-mark{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--navy);
  box-shadow:0 0 0 2px #fff;transform:translateX(-1.5px)}
.regua-scale{position:relative;height:13px;margin-top:5px;font-size:10px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.regua-scale span{position:absolute;top:0;white-space:nowrap}
.regua-scale .ini{left:0}.regua-scale .fim{right:0}

.u-linha2{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--linha);font-size:11px;color:var(--ink-3)}
.u-linha2 b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px;
  font-size:13.5px}
/* A frase em português é para o Carlos. O número cru já está acima, para o gestor. */
.u-frase{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.5}
.u-frase b{color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- gráficos ---------- */
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:15px;
  padding:18px 20px 14px;box-shadow:var(--sombra)}
.cartao-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.cartao-tit{font-size:15px;font-weight:700;letter-spacing:-.012em;color:var(--ink)}
.cartao-sub{font-size:12px;color:var(--ink-3);margin-top:3px;max-width:62ch;line-height:1.5}
.legenda{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);
  font-weight:700;white-space:nowrap}
.legenda i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;
  vertical-align:-1px}
.plot{position:relative;width:100%;margin-top:14px;overflow-x:auto}
.plot svg{display:block;width:100%;height:auto}
.tabmes{margin-top:12px;border-top:1px solid var(--linha);padding-top:10px}
.tabmes summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-3);
  list-style:none;padding:2px 0}
.tabmes summary::-webkit-details-marker{display:none}
.tabmes summary::before{content:"\203A";display:inline-block;margin-right:7px;font-size:15px;
  color:var(--orange-dark);transition:transform .16s}
.tabmes[open] summary::before{transform:rotate(90deg)}
.tabmes summary:hover{color:var(--ink)}
.tabmes .rolagem{overflow-x:auto}
.tabmes table{width:100%;border-collapse:collapse;font-size:12px;margin-top:9px}
.tabmes th,.tabmes td{padding:6px 10px;text-align:right;white-space:nowrap;
  border-bottom:1px solid rgba(26,36,71,.08);font-variant-numeric:tabular-nums}
.tabmes th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700}
.tabmes th:first-child,.tabmes td:first-child{text-align:left;font-weight:700;color:var(--ink)}

/* ---------- criativos ---------- */
.sel-uni{display:inline-flex;align-items:center;gap:9px;background:var(--branco);
  border:1px solid var(--linha);border-radius:11px;padding:5px 6px 5px 14px;box-shadow:var(--sombra)}
.sel-uni > span{font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ink-3)}
.sel-uni select{appearance:none;font-family:var(--sans);font-size:13px;font-weight:700;
  color:var(--ink);background:var(--off);border:1px solid var(--linha);border-radius:8px;
  padding:8px 30px 8px 12px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2377809B' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:13px}
.sel-uni select:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.crs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.cr{display:flex;gap:13px;align-items:flex-start;background:var(--branco);
  border:1px solid var(--linha);border-radius:13px;padding:14px 16px;box-shadow:var(--sombra);
  transition:border-color .15s}
.cr:hover{border-color:var(--linha-forte)}
.cr.zerado{opacity:.78}
.cr.destaque{border-color:rgba(33,135,77,.45)}
.cr-rank{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--off);
  border:1px solid var(--linha);border-radius:7px;width:25px;height:25px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.cr-tag{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;color:var(--pos);
  background:rgba(33,135,77,.10);border:1px solid rgba(33,135,77,.28)}
.cr-thumb{width:64px;height:64px;border-radius:10px;flex:0 0 auto;border:1px dashed var(--linha-forte);
  background:var(--off);display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  flex-direction:column;gap:3px}
.cr-thumb svg{width:20px;height:20px}
.cr-thumb .fmt{font-size:8.5px;font-weight:700;letter-spacing:.06em}
.cr-body{flex:1;min-width:0}
.cr-nome{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
.cr-mets{display:flex;flex-wrap:wrap;gap:4px 15px;margin-top:9px;font-size:11px;color:var(--ink-3)}
.cr-mets b{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;
  margin-right:4px}
.cr-zero{font-size:10.5px;color:var(--neg);margin-top:8px;font-weight:700}
.cr-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:11px}
.ver{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  color:var(--orange-dark);text-decoration:none;padding:4px 10px;border-radius:8px;
  border:1px solid rgba(188,76,20,.3);transition:.14s}
.ver svg{width:12px;height:12px}
.ver:hover{background:rgba(234,116,57,.09);border-color:var(--orange-dark)}
.ver:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ---------- leitura ---------- */
.leitura{background:var(--branco);border:1px solid var(--linha);border-radius:15px;
  padding:20px 22px;box-shadow:var(--sombra)}
.leitura ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.leitura li{font-size:14px;line-height:1.6;color:var(--ink-2)}
.leitura li:first-child{color:var(--ink);font-weight:700;font-size:14.5px}
.aprof{margin-top:16px;padding:14px 16px;background:var(--off);border-radius:11px}
.aprof .t{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:8px}
.aprof ul{gap:7px}
.aprof li{font-size:12.5px;color:var(--ink-2);padding-left:14px;position:relative;font-weight:400}
.aprof li::before{content:"\2192";position:absolute;left:0;color:var(--orange-dark);font-weight:700}

.aviso{font-size:12.5px;color:var(--ink-3);background:var(--branco);
  border:1px dashed var(--linha-forte);border-radius:12px;padding:13px 16px}
.aviso b{color:var(--ink)}

.foot{margin-top:48px;border-top:1px solid var(--linha-forte);padding-top:22px;
  font-size:12.5px;color:var(--ink-3);line-height:1.75;display:flex;flex-wrap:wrap;gap:20px;
  align-items:center;justify-content:space-between}
.foot .logo{height:30px}

@media (max-width:640px){
  .hero{padding:28px 22px 26px}
  .hero-in{flex-direction:column;align-items:flex-start;gap:18px}
  .hero-meta{align-items:flex-start}
  .stamp{text-align:left}
  .placar{padding:20px}
  .periodo-nota{text-align:left}
  .seg{width:100%} .seg button{flex:1;padding:9px 10px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* SVG à mão, sem biblioteca. Uma escala por painel; cor de dado é dado; todo valor
   também existe em texto, então nada depende de o leitor enxergar cor. */
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };
const tx = (x, y, s, a = {}) => { const t = el('text', { x, y, ...a }); t.textContent = s; return t; };

const C = {
  verba:'#4660AA', leads:'#BC4C14',
  ok:'#21874D', warn:'#8A6D00', bad:'#EF0000',
  grade:'rgba(26,36,71,.10)', eixo:'rgba(26,36,71,.26)', texto:'#77809B',
  tinta:'#3E4763', linha:'#1A2447', ultimo:'#EA7439',
  fxOk:'rgba(33,135,77,.07)', fxWarn:'rgba(234,179,8,.12)', fxBad:'rgba(239,0,0,.045)'
};
const CORST = { ok:C.ok, warn:C.warn, bad:C.bad };

function ticks(max) {
  const bruto = max / 4.2, mag = Math.pow(10, Math.floor(Math.log10(bruto || 1)));
  const passo = [1,2,2.5,5,10].map(x => x*mag).find(x => x >= bruto) || 10*mag;
  const out = []; for (let v = 0; v <= max + 1e-9; v += passo) out.push(+v.toFixed(6));
  return out;
}
// ticks() pode devolver um último tick MENOR que o maior valor da série
// (ticks(24.6) -> [0,10,20]). Aí a barra estoura o plot e o rótulo sai da tela.
// escala() mantém os ticks como rótulos, mas estica o domínio até cobrir o dado.
function escala(maxValor, folga = 1.12) {
  const tk = ticks(maxValor * folga);
  return { tk, max: Math.max(tk[tk.length - 1] || 1, maxValor * 1.04) };
}
function novoPlot(host, W, H, aria) {
  host.innerHTML = '';
  const svg = el('svg', { viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':aria });
  host.appendChild(svg);
  return svg;
}

  const PADL = 62, PADR = 26, PADT = 22, GAP = 30, PADB = 24;
  const HA = 132, HB = 70;
  const H = PADT + HA + GAP + HB + PADB, IW = W - PADL - PADR, n = ms.length;
  const svg = novoPlot(host, W, H, 'Custo por lead e investimento da conta, mês a mês');
  const banda = IW / n, X = i => PADL + banda * i + banda/2;

  const { tk: tkA, max: maxA } = escala(Math.max(...ms.map(m => m.cpl)), 1.18);
  const YA = v => PADT + HA - (v/maxA) * HA;

  [[0, D.regua.verde, C.fxOk], [D.regua.verde, D.regua.amarelo, C.fxWarn],
   [D.regua.amarelo, maxA, C.fxBad]].forEach(([a,b,cor]) => {
    if (b <= a) return;
    const y1 = YA(Math.min(b, maxA)), y2 = YA(a);
    svg.appendChild(el('rect', { x:PADL, y:y1, width:IW, height:Math.max(0, y2-y1), fill:cor }));
  });
  tkA.forEach(v => {
    svg.appendChild(el('line', { x1:PADL, x2:PADL+IW, y1:YA(v), y2:YA(v),
      stroke: v === 0 ? C.eixo : C.grade, 'stroke-width':1 }));
    svg.appendChild(tx(PADL-9, YA(v)+3.5, brl0(v), { 'text-anchor':'end', fill:C.texto, 'font-size':10 }));
  });
  svg.appendChild(tx(PADL, PADT-10, 'custo por lead', { fill:C.texto, 'font-size':10, 'font-weight':700 }));

  const pts = ms.map((m,i) => ({ x:X(i), y:YA(m.cpl) }));
  svg.appendChild(el('path', { d: pts.map((p,i) => (i?'L':'M')+p.x+' '+p.y).join(' '),
    fill:'none', stroke:C.linha, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }));
  pts.forEach((p,i) => svg.appendChild(el('circle', { cx:p.x, cy:p.y, r:4.5,
    fill: i === n-1 ? C.ultimo : C.linha, stroke:'#fff', 'stroke-width':2 })));
  // rótulo em todos os pontos: são só quatro, e a queda é a história do gráfico
  ms.forEach((m,i) => svg.appendChild(tx(pts[i].x, pts[i].y - 12, brl0(m.cpl),
    { 'text-anchor':'middle', fill:C.tinta, 'font-size':11.5, 'font-weight':700,
      stroke:'#fff', 'stroke-width':3.5, 'paint-order':'stroke' })));

  const topoB = PADT + HA + GAP;
  const maxB = Math.max(...ms.map(m => m.spend)) * 1.12 || 1;
  const YB = v => topoB + HB - (v/maxB) * HB;
  svg.appendChild(el('line', { x1:PADL, x2:PADL+IW, y1:topoB+HB, y2:topoB+HB,
    stroke:C.eixo, 'stroke-width':1 }));
  svg.appendChild(tx(PADL, topoB-6, 'investido', { fill:C.texto, 'font-size':10, 'font-weight':700 }));
  const topoTick = Math.max(...ms.map(m => m.spend));
  svg.appendChild(el('line', { x1:PADL, x2:PADL+IW, y1:YB(topoTick), y2:YB(topoTick),
    stroke:C.grade, 'stroke-width':1 }));
  svg.appendChild(tx(PADL-9, YB(topoTick)+3.5, brl0(topoTick), { 'text-anchor':'end', fill:C.texto, 'font-size':10 }));
  svg.appendChild(tx(PADL-9, topoB+HB+3.5, 'R$ 0', { 'text-anchor':'end', fill:C.texto, 'font-size':10 }));
  const larg = Math.min(30, Math.max(10, banda - 30));
  ms.forEach((m,i) => {
    const y = YB(m.spend);
    svg.appendChild(el('rect', { x:X(i)-larg/2, y, width:larg, height:Math.max(2, topoB+HB-y),
      rx:4, ry:4, fill:C.verba, opacity: m.parcial ? .45 : 1 }));
  });

  ms.forEach((m,i) => svg.appendChild(tx(X(i), H-7, m.rot + (m.parcial ? '*' : ''),
    { 'text-anchor':'middle', fill:C.texto, 'font-size':10.5 })));
}

/* ---- 2. participação: verba × leads ---- */
function grafParticipacao(host, W) {
  const dd = D.corretores.map(c => ({ nome:c.nome, spend:c.spend, leadsN:c.leads,
      verba: c.spend / T.spend * 100, leads: c.leads / T.leads * 100 }))
    .sort((a,b) => (b.leads - b.verba) - (a.leads - a.verba));

  const PADL = Math.min(140, Math.max(96, W*0.16)), PADR = 58, PADT = 6, PADB = 26;
  const linhaH = 42, barH = 13, vao = 3;
  const H = PADT + dd.length*linhaH + PADB, IW = W - PADL - PADR;
  const { tk, max } = escala(Math.max(...dd.flatMap(d => [d.verba, d.leads])), 1.1);
  const X = v => PADL + (v/max) * IW;
  const svg = novoPlot(host, W, H, 'Fatia de cada corretor na verba e nos leads');

  tk.forEach(v => {
    svg.appendChild(el('line', { x1:X(v), x2:X(v), y1:PADT, y2:PADT+dd.length*linhaH,
      stroke: v === 0 ? C.eixo : C.grade, 'stroke-width':1 }));
    svg.appendChild(tx(X(v), H-9, v+'%', { 'text-anchor':'middle', fill:C.texto, 'font-size':10.5 }));
  });

  dd.forEach((d,i) => {
    const y = PADT + i*linhaH, meio = y + linhaH/2;
    svg.appendChild(tx(PADL-11, meio+3.5, d.nome,
      { 'text-anchor':'end', fill:C.tinta, 'font-size':12, 'font-weight':700 }));
    const yV = meio - barH - vao/2, yL = meio + vao/2;
    svg.appendChild(el('rect', { x:PADL, y:yV, width:Math.max(1, X(d.verba)-PADL),
      height:barH, rx:4, ry:4, fill:C.verba }));
    svg.appendChild(el('rect', { x:PADL, y:yL, width:Math.max(1, X(d.leads)-PADL),
      height:barH, rx:4, ry:4, fill:C.leads }));
    svg.appendChild(tx(X(d.verba)+7, yV+barH-2, d.verba.toFixed(0)+'%',
      { fill:C.texto, 'font-size':10.5 }));
    svg.appendChild(tx(X(d.leads)+7, yL+barH-2, d.leads.toFixed(0)+'%',
      { fill:C.tinta, 'font-size':11, 'font-weight':700 }));
  });
}

/* ---- 3. taxa de clique que vira conversa ---- */
/* A fatia que vira conversa vai de 4% a 22%. Desenhada dentro da barra de cliques
   ela vira um fio invisível e o gráfico passa a depender do número escrito ao lado.
   Plotando a taxa em si, a barra volta a carregar a informação. */
function grafFunil(host, W) {
  const dd = D.corretores.map(c => {
    const cl = cliques(c);
    return { nome:c.nome, cliques:cl, leads:c.leads, taxa: cl ? c.leads / cl * 100 : 0 };
  }).sort((a,b) => b.taxa - a.taxa);

  const PADL = Math.min(140, Math.max(96, W*0.16)), PADR = 152, PADT = 8, PADB = 30;
  const linhaH = 48, barH = 20;
  const H = PADT + dd.length*linhaH + PADB, IW = W - PADL - PADR;
  const { tk, max } = escala(Math.max(...dd.map(d => d.taxa)));
  const X = v => PADL + (v/max) * IW;
  const media = T.leads / T.cliques * 100;
  const svg = novoPlot(host, W, H, 'Percentual de cliques que viraram conversa, por corretor');

  tk.forEach(v => {
    svg.appendChild(el('line', { x1:X(v), x2:X(v), y1:PADT, y2:PADT+dd.length*linhaH,
      stroke: v === 0 ? C.eixo : C.grade, 'stroke-width':1 }));
    svg.appendChild(tx(X(v), H-11, v+'%', { 'text-anchor':'middle', fill:C.texto, 'font-size':10.5 }));
  });

  // média da operação: a referência que diz quem está acima e quem está abaixo
  svg.appendChild(el('line', { x1:X(media), x2:X(media), y1:PADT, y2:PADT+dd.length*linhaH,
    stroke:C.linha, 'stroke-width':1.5, 'stroke-dasharray':'4 3' }));
  svg.appendChild(tx(X(media), H-11, 'média ' + media.toFixed(0) + '%',
    { 'text-anchor':'middle', fill:C.linha, 'font-size':10.5, 'font-weight':700,
      stroke:'#fff', 'stroke-width':3.5, 'paint-order':'stroke' }));

  dd.forEach((d,i) => {
    const y = PADT + i*linhaH, meio = y + linhaH/2;
    svg.appendChild(tx(PADL-11, meio-1, d.nome,
      { 'text-anchor':'end', fill:C.tinta, 'font-size':12, 'font-weight':700 }));
    svg.appendChild(tx(PADL-11, meio+13, n0(d.cliques) + ' cliques · ' + n0(d.leads) + ' conversas',
      { 'text-anchor':'end', fill:C.texto, 'font-size':10 }));
    svg.appendChild(el('rect', { x:PADL, y:meio-barH/2, width:Math.max(2, X(d.taxa)-PADL),
      height:barH, rx:5, ry:5, fill: d.taxa >= media ? C.ok : C.leads }));
    // halo branco: o rótulo pode cair em cima da linha tracejada da média
    svg.appendChild(tx(X(d.taxa)+9, meio+6, d.taxa.toFixed(0) + ' de cada 100',
      { fill:C.tinta, 'font-size':12, 'font-weight':700,
        stroke:'#fff', 'stroke-width':3.5, 'paint-order':'stroke' }));
  });
}

function pintaGraficos() {
  [['g-mes', grafMeses], ['g-part', grafParticipacao], ['g-funil', grafFunil]]
    .forEach(([id, fn]) => {
      const host = document.getElementById(id);
      if (!host) return;
      fn(host, Math.max(340, Math.round(host.clientWidth) || 860));
    });
}

pintaCriativos();
pintaGraficos();
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(pintaGraficos, 160); });
})();
</script>
